name: ci
on:
  push:
    # Docs/community-file-only changes cannot change the binaries, so skip the 15+ minute build.
    # (Side effect: a docs-only commit on main does not republish the "latest" release - the
    # installer content would be identical anyway.) marketplace/** is deliberately NOT ignored.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"

# Cancel a superseded run of the same branch/PR. Runs on main are never cancelled (each one has its
# own group, keyed by run id) because main publishes the "latest" release.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write   # publishes the "latest" pre-release with HBStudio-Setup.exe

env:
  WEBVIEW2_SDK_VERSION: 1.0.3856.49

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # ccache is used on Linux only (the Visual Studio generator ignores compiler launchers).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPRESS: "1"
      # MSVC: compile the files of one project in parallel (cmake --build --parallel only
      # parallelises across projects). Empty on Linux.
      # (job-level env cannot use the `runner` context, only matrix/github/...: use matrix.os)
      CXXFLAGS: ${{ startsWith(matrix.os, 'windows') && '/MP' || '' }}
      CFLAGS: ${{ startsWith(matrix.os, 'windows') && '/MP' || '' }}
    steps:
      - uses: actions/checkout@v4

      # FetchContent sources (googletest, pugixml, miniz, miniaudio, vst3sdk, whisper.cpp) and
      # their already-compiled objects live in .deps (see FETCHCONTENT_BASE_PATH below). Restored
      # on every run; saved only from main so feature branches cannot evict it (branches can read
      # main's cache). A partial (prefix) hit is fine: the build tool rebuilds only what changed.
      - name: Restore dependency cache
        id: cache_deps
        uses: actions/cache/restore@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/modules/*.cmake') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Restore ccache (Linux)
        id: cache_ccache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: command -v ccache || sudo apt-get install -y --no-install-recommends ccache

      - name: UI sources in sync (ui/index.html is generated from ui/src)
        if: runner.os == 'Linux'
        run: python3 -I tools/build_ui.py --check

      - name: Restore WebView2 SDK cache (Windows)
        id: cache_wv2
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: third_party/webview2
          key: webview2-${{ env.WEBVIEW2_SDK_VERSION }}

      - name: Fetch WebView2 SDK (Windows)
        if: runner.os == 'Windows' && steps.cache_wv2.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WEBVIEW2_SDK_VERSION" -OutFile wv2.zip
          Expand-Archive wv2.zip third_party/webview2 -Force

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_BASE_PATH="$PWD/.deps"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DFETCHCONTENT_BASE_PATH=$PWD/.deps"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        # Parallel for speed. A few tests use fixed temp-directory names, so on any failure the
        # failed tests are re-run serially before the step is allowed to fail.
        shell: bash
        run: |
          ctest --test-dir build -C Release -j 4 --output-on-failure \
            || ctest --test-dir build -C Release --rerun-failed --output-on-failure

      - name: Save dependency cache (main only)
        if: github.ref == 'refs/heads/main' && steps.cache_deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/modules/*.cmake') }}

      - name: Save ccache (Linux, main only)
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: UI interaction tests (real browser, clicks + 15 Hz state feed)
        if: runner.os == 'Linux'
        working-directory: tools/ui
        run: |
          npm install playwright-core@1.49.1 --no-save --no-audit --no-fund
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" node ui_test.js ../../ui/index.html

      - name: Virtual camera self-test (loads the DLL in-process)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/Release
        run: ./hb_vcam_selftest.exe

      # Real UI smoke test: starts the real executables, lets the UI render, saves a PNG.
      - name: UI screenshots (real HBStudio.exe / HBStudio-Setup.exe)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots | Out-Null
          $env:HB_TRACE = "$PWD\shots\app.trace.txt"
          $p = Start-Process build/Release/HBStudio.exe -ArgumentList "--screenshot","$PWD\shots\app.png" -PassThru
          if (-not $p.WaitForExit(45000)) { "HBStudio.exe timed out; Responding=$($p.Responding)"; $p.Kill() } else { "HBStudio.exe exit code $($p.ExitCode)" }
          if (Test-Path $env:HB_TRACE) { Get-Content $env:HB_TRACE }
          Remove-Item Env:HB_TRACE
          $p = Start-Process build/Release/HBStudio-Setup.exe -ArgumentList "--screenshot","$PWD\shots\setup.png" -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); "Setup timed out" }
          Get-ChildItem shots

      - name: Camera enumeration smoke test (no cameras expected on a CI runner)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process build/Release/HBStudio.exe -ArgumentList "--list-cameras","$PWD\cameras.json" -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "--list-cameras timed out" }
          if ($p.ExitCode -ne 0) { throw "--list-cameras exit code $($p.ExitCode)" }
          "cameras.json: " + (Get-Content cameras.json -Raw)

      - name: Upload screenshots
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/HBStudio-Setup.exe dist/
          Get-Item dist/HBStudio-Setup.exe | Select-Object Name, Length
          # Example plugins (source + theme), packaged and signed (sha256) by hb_pack, for anyone who
          # wants to see how a .hbplugin is built or just try installing one.
          New-Item -ItemType Directory stage/colorbars -Force | Out-Null
          Copy-Item plugins/examples/colorbars/manifest.json stage/colorbars/
          Copy-Item build/Release/hb_plugin_example.dll stage/colorbars/
          build/Release/hb_pack.exe stage/colorbars dist/HBStudio-Plugin-Fontes-Exemplo.hbplugin
          build/Release/hb_pack.exe plugins/examples/theme-midnight dist/HBStudio-Tema-Meia-Noite.hbplugin
          Get-ChildItem dist/*.hbplugin | Select-Object Name, Length

      - name: Sign installer (only acts once a code-signing certificate secret is configured)
        # Without this, HBStudio-Setup.exe is unsigned and Windows SmartScreen blocks it on first
        # run ("Windows protected your PC" / "the publisher could not be verified") - expected
        # behaviour for any unsigned download, not a bug. The step always runs, but the script
        # itself exits early (no-op) until the repo has WIN_CODESIGN_PFX_BASE64/
        # WIN_CODESIGN_PFX_PASSWORD secrets (see BUILD.md "Assinatura de código") - referencing
        # `secrets` straight in an `if:` is deliberately avoided here, that form has been seen to
        # trip up GitHub's own workflow-file validation ("likely failed because of a workflow file
        # issue", no job even starts) on some accounts/repos.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_CODESIGN_PFX_BASE64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
          WIN_CODESIGN_PFX_PASSWORD: ${{ secrets.WIN_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WIN_CODESIGN_PFX_BASE64)) {
            "No code-signing certificate configured (WIN_CODESIGN_PFX_BASE64 secret unset) - skipping. See BUILD.md."
            exit 0
          }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WIN_CODESIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found on this runner image" }
          & $signtool sign /f $pfxPath /p $env:WIN_CODESIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist/HBStudio-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
          Remove-Item $pfxPath -Force
          & $signtool verify /pa dist/HBStudio-Setup.exe

      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HBStudio-Setup
          path: |
            dist/HBStudio-Setup.exe
            dist/*.hbplugin

      - name: Publish "latest" pre-release
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest dist/HBStudio-Setup.exe dist/*.hbplugin --prerelease --target ${{ github.sha }} `
            --title "HB Studio - ultima versao" `
            --notes "Instalador automatico (commit ${{ github.sha }}). Baixe HBStudio-Setup.exe, de dois cliques e siga a janela. Os arquivos .hbplugin sao plugins de exemplo (Plugins > Instalar plugin)."
