name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Virtual camera self-test (loads the DLL in-process)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/Release
        run: ./hb_vcam_selftest.exe
      - name: Package virtual camera PoC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/hb_vcam_poc.exe, build/Release/hb_vcam_source.dll dist/
          Copy-Item tools/vcam/*.ps1 dist/
          Copy-Item docs/VIRTUAL_CAMERA.md dist/LEIA-ME.md
      - name: Upload virtual camera PoC
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hb-studio-vcam-poc
          path: dist
