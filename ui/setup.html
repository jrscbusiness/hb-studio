<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>HB Studio — Instalador</title>
<style>
:root{--bg:#F2F6FD;--line:#DDE7F8;--line-2:#C9D8F2;--ink:#0A1E47;--ink-2:#3B5280;--muted:#7A8DB3;--blue:#1F6BFF;--blue-2:#4F8DFF;--sky:#BFD6FF;--mist:#EAF1FF;
--mono:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;--sans:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;cursor:default;
 background-image:radial-gradient(700px 360px at 90% -10%,rgba(79,141,255,.22),transparent 60%),radial-gradient(600px 300px at -10% 110%,rgba(31,107,255,.12),transparent 60%),radial-gradient(circle,#CFDCF5 1px,transparent 1.2px);
 background-size:auto,auto,26px 26px;display:grid;place-items:center}
.card{width:640px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 0 #fff inset,0 24px 70px rgba(20,60,160,.14);padding:38px 44px 30px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--blue-2),var(--blue),transparent)}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo svg{width:44px;height:44px}
.logo b{letter-spacing:.38em;font-size:16px}
.logo small{display:block;letter-spacing:.2em;font-size:9.5px;color:var(--muted);margin-top:4px;font-weight:600}
h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
p.lead{color:var(--ink-2);line-height:1.6;font-size:14px;margin-bottom:22px}
.screen{display:none}.screen.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--blue-2);background:var(--mist)}
.opt input{display:none}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:.15s;background:#fff}
.opt input:checked+.box{background:var(--blue);border-color:var(--blue);box-shadow:0 4px 12px rgba(31,107,255,.35)}
.opt input:checked+.box::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt span{font-size:13.5px}.opt em{display:block;font-style:normal;color:var(--muted);font-size:11.5px;margin-top:2px}
.path{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--mist);padding:9px 12px;border-radius:10px;margin:4px 0 20px;word-break:break-all}
.row{display:flex;gap:12px;justify-content:flex-end;margin-top:22px}
.btn{height:44px;padding:0 26px;border-radius:12px;font:inherit;font-weight:700;letter-spacing:.1em;font-size:12px;border:1px solid var(--line-2);background:#fff;color:var(--blue);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--blue);background:var(--mist)}
.btn.primary{background:linear-gradient(180deg,#3C86FF,#1F6BFF);color:#fff;border-color:var(--blue);box-shadow:0 10px 26px rgba(31,107,255,.35)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:8px;border-radius:8px;background:var(--mist);overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue-2),var(--blue));border-radius:8px;transition:width .45s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 14px rgba(31,107,255,.5)}
.steps div{display:flex;align-items:center;gap:12px;padding:7px 0;color:var(--muted);font-size:13px;transition:.2s}
.steps div .d{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.steps div.cur{color:var(--ink)}.steps div.cur .d{border-color:var(--blue);border-top-color:transparent;animation:rot .8s linear infinite}
.steps div.ok{color:var(--ink-2)}.steps div.ok .d{background:var(--blue);border-color:var(--blue)}
.steps div.ok .d::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-.5px,-.5px)}
.steps div.bad{color:#B3261E}.steps div.bad .d{border-color:#B3261E;background:#B3261E}
@keyframes rot{to{transform:rotate(360deg)}}
.big{width:68px;height:68px;border-radius:50%;background:var(--mist);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 0 0 10px rgba(31,107,255,.07)}
.big svg{width:34px;height:34px}
.err{background:#FFF6E5;border:1px solid #F3D08A;color:#7A5200;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-top:14px;white-space:pre-wrap;user-select:text}
.foot{margin-top:22px;color:var(--muted);font-size:10.5px;letter-spacing:.12em;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none"><path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25L16 2.5Z" stroke="#1F6BFF" stroke-width="1.8"/><circle cx="16" cy="16" r="5.2" stroke="#1F6BFF" stroke-width="1.8"/><circle cx="16" cy="16" r="1.7" fill="#1F6BFF"/><path d="M16 2.5v8.3M16 21.2v8.3M4.3 9.25l7.2 4.15M20.5 18.6l7.2 4.15M27.7 9.25l-7.2 4.15M11.5 18.6l-7.2 4.15" stroke="#9DBDFF" stroke-width="1.2"/></svg>
    <div><b>HB STUDIO</b><small id="ver">PRODUÇÃO DE VÍDEO AO VIVO</small></div>
  </div>

  <!-- boas-vindas / instalar -->
  <div class="screen on" id="s-welcome">
    <h1 id="w-title">Instalar o HB Studio</h1>
    <p class="lead" id="w-lead">Mesa de produção de vídeo ao vivo: Preview, Program, corte e dissolve, e câmera virtual para o OBS. A instalação leva alguns segundos.</p>
    <div class="path" id="w-path">C:\Program Files\HB Studio</div>
    <div id="w-opts">
      <label class="opt"><input type="checkbox" id="o-desktop" checked><span class="box"></span><span>Atalho na Área de Trabalho</span></label>
      <label class="opt"><input type="checkbox" id="o-vcam" checked><span class="box"></span><span>Instalar a câmera virtual<em>Aparece como “HB Studio Windows Virtual Camera” no OBS, Zoom e Teams (Windows 11)</em></span></label>
    </div>
    <div class="row"><button class="btn" id="b-cancel">CANCELAR</button><button class="btn primary" id="b-go">INSTALAR</button></div>
  </div>

  <!-- progresso -->
  <div class="screen" id="s-progress">
    <h1 id="p-title">Instalando…</h1>
    <p class="lead" id="p-lead">Não feche esta janela.</p>
    <div class="bar"><i id="bar"></i></div>
    <div class="steps" id="steps"></div>
  </div>

  <!-- concluído -->
  <div class="screen" id="s-done">
    <div class="big" id="d-icon"><svg viewBox="0 0 34 34" fill="none" stroke="#1F6BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18l7 7L27 10"/></svg></div>
    <h1 id="d-title">Tudo pronto</h1>
    <p class="lead" id="d-lead"></p>
    <div class="err" id="d-err" style="display:none"></div>
    <div class="row"><button class="btn" id="b-close">FECHAR</button><button class="btn primary" id="b-launch">ABRIR O HB STUDIO</button></div>
  </div>
  <div class="foot">HB STUDIO · SOFTWARE LIVRE</div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const host = window.chrome && window.chrome.webview;
  const send = (...a) => host && host.postMessage(a.join('|'));
  let mode = 'install';
  const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));

  $('#b-cancel').onclick = () => send('close');
  $('#b-close').onclick = () => send('close');
  $('#b-launch').onclick = () => send('launch');
  $('#b-go').onclick = () => {
    show('s-progress');
    $('#steps').innerHTML = '';
    send(mode, 'desktop=' + ($('#o-desktop').checked ? 1 : 0), 'vcam=' + ($('#o-vcam').checked ? 1 : 0));
  };

  const steps = [];
  const onMsg = m => {
    const d = typeof m === 'string' ? JSON.parse(m) : m;
    if (d.t === 'mode') {
      mode = d.mode;
      $('#ver').textContent = 'VERSÃO ' + d.version;
      $('#w-path').textContent = d.path;
      if (mode === 'uninstall') {
        $('#w-title').textContent = 'Remover o HB Studio';
        $('#w-lead').textContent = 'O programa, a câmera virtual e os atalhos serão removidos deste computador.';
        $('#w-opts').style.display = 'none';
        $('#b-go').textContent = 'REMOVER';
        $('#p-title').textContent = 'Removendo…';
      }
    } else if (d.t === 'step') {
      let el = steps[d.i];
      if (!el) { el = document.createElement('div'); el.innerHTML = '<span class="d"></span><span></span>'; $('#steps').appendChild(el); steps[d.i] = el; }
      el.lastChild.textContent = d.label;
      steps.forEach((s, k) => { if (!s) return; s.className = k < d.i ? 'ok' : (k === d.i ? (d.state === 'bad' ? 'bad' : d.state === 'ok' ? 'ok' : 'cur') : ''); });
      $('#bar').style.width = d.pct + '%';
    } else if (d.t === 'done') {
      steps.forEach(s => s && (s.className = s.className === 'bad' ? 'bad' : 'ok'));
      $('#bar').style.width = '100%';
      setTimeout(() => {
        show('s-done');
        const uni = mode === 'uninstall';
        $('#d-title').textContent = d.ok ? (uni ? 'HB Studio removido' : 'Tudo pronto') : 'Não foi possível concluir';
        $('#d-lead').textContent = d.ok ? (uni ? 'Obrigado por usar o HB Studio.' : 'O HB Studio foi instalado. Procure por “HB Studio” no menu Iniciar.') : 'Veja o detalhe abaixo.';
        $('#b-launch').style.display = d.ok && !uni ? '' : 'none';
        const e = $('#d-err'); e.style.display = d.msg ? '' : 'none'; e.textContent = d.msg || '';
        if (!d.ok) $('#d-icon').innerHTML = '<svg viewBox="0 0 34 34" fill="none" stroke="#B3261E" stroke-width="3" stroke-linecap="round"><path d="M10 10l14 14M24 10L10 24"/></svg>';
      }, 600);
    }
  };
  if (host) { host.addEventListener('message', e => onMsg(e.data)); send('ready'); }
  window.__hbMessage = onMsg;
})();
</script>
</body>
</html>
