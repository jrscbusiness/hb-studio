    <!-- ===================== TRANSMISSÃO ===================== -->
    <section class="view" id="v-xmit">
      <div class="xmitwrap">
        <div class="card">
          <h3><span class="cap">Destinos de transmissão</span>
            <span class="xc-topbtns">
              <button class="btn sm" id="xmit-stopall">ENCERRAR TODAS</button>
              <button class="btn primary sm" id="xmit-startall">INICIAR TODAS</button>
            </span>
          </h3>
          <div class="body">
            <p class="note">Transmita ao vivo simultaneamente para várias plataformas. Não há login
              nem permissão de conta aqui — cada destino usa a chave de transmissão que você mesmo
              copia da sua conta naquela plataforma, exatamente como o OBS Studio faz.</p>
            <div id="xmit-list" class="xmitlist"></div>
            <button class="btn wide sm" id="xmit-add" style="margin-top:14px">+ ADICIONAR DESTINO</button>
          </div>
        </div>
      </div>
    </section>
